name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Test with coverage (includes stack, locale and privacy validation)
        run: swift test --enable-code-coverage
      - name: Export coverage as lcov
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          # Keep this list in sync with `ignore:` in codecov.yml.
          xcrun llvm-cov export \
            "$BIN_PATH/DevSweepPackageTests.xctest/Contents/MacOS/DevSweepPackageTests" \
            -instr-profile "$BIN_PATH/codecov/default.profdata" \
            -ignore-filename-regex='(\.build|Tests)/|Sources/DevSweep/UI/|App/(AppModel|DevSweepApp|Updater)\.swift|Advisor/Notifier\.swift' \
            -format=lcov > coverage.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Build app bundle
        run: ./scripts/build-app.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --results=verified,unknown
