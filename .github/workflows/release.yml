name: Release

# release-please keeps a "chore(main): release x.y.z" pull request up to date from
# Conventional Commits. Merging it tags the version, publishes the GitHub release with
# the changelog, and the build job attaches the app, the Sparkle appcast, an SBOM and
# Sigstore signatures to it. The last job publishes the npm installer through npm trusted
# publishing (OIDC, no token), once the PUBLISH_NPM repository variable is set to "true".
#
# The Homebrew cask (Casks/devsweep.rb) needs no job: it points at the stable
# releases/latest/download/DevSweep.zip URL.
#
# The workflow can also be run by hand to (re)build the assets of an existing tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish assets for, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: [release-please]
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write # Sigstore keyless signing
      attestations: write # SLSA build provenance
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          persist-credentials: false
      - name: Resolve the version from the tag
        run: echo "DEVSWEEP_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Build universal app
        env:
          UNIVERSAL: "1"
        run: ./scripts/build-app.sh
      - name: Package, sign the update and write the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/package-release.sh
      - name: Generate an SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: build/release/DevSweep-${{ env.DEVSWEEP_VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the release files with Sigstore
        # cosign 3+ writes a bundle that carries the signature, the certificate and the
        # transparency-log proof together; --output-signature/--output-certificate are gone.
        run: |
          for file in build/release/*.zip build/release/*.spdx.json; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/release/DevSweep-${{ env.DEVSWEEP_VERSION }}.zip
            build/release/DevSweep.zip
      - name: Ship the provenance with the release
        run: cp "${{ steps.attest.outputs.bundle-path }}" "build/release/DevSweep-${DEVSWEEP_VERSION}.intoto.jsonl"
      - name: Attach everything to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/release/* --clobber

  publish-npm:
    needs: [release-please, build]
    # Set the PUBLISH_NPM repository variable to "true" once the package exists on npm and
    # trusted publishing is configured for it (see docs/MAINTAINING.md).
    if: ${{ always() && needs.build.result == 'success' && vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no token involved
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          persist-credentials: false
      # Node 24 ships npm 11, which is what speaks OIDC (trusted publishing needs >= 11.5.1).
      # Installing npm separately would add an unpinned dependency to the release.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check npm can use trusted publishing
        run: |
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '%s\n11.5.1\n' "$version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm >= 11.5.1 is required for trusted publishing, got $version"
            exit 1
          fi
      - name: Publish the installer to npm
        run: |
          cd packaging/npm
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version
          NAME="$(node -p 'require("./package.json").name')"
          # Rebuilding the assets of an existing tag reaches this step again, and npm
          # refuses to publish a name@version twice.
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already on npm."
          else
            npm publish --access public
          fi

